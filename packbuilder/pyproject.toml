[project]
name = "packbuilder"
version = "0.1.0"
description = "Builds BirdJournal species packs from iNaturalist Open Data: license-filtered photos, detector crops, SQLite, credits."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "duckdb>=1.1",
    "numpy>=2.0",
    "onnxruntime>=1.20",
    "pillow>=11.0",
    "requests>=2.32",
]

[project.scripts]
packbuilder = "packbuilder.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/packbuilder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
