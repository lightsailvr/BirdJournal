[project]
name = "birdjournal-infra"
version = "0.1.0"
description = "BirdJournal AWS infrastructure (CDK)"
authors = [
    { name = "Matthew Celia", email = "matt@lightsailvr.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aws-cdk-lib>=2.200.0",
    "constructs>=10.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
