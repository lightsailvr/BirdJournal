# systemd drop-in for comfyui.service on comfybox: /etc/systemd/system/comfyui.service.d/tailnet-only.conf
# ComfyUI has no authentication, so it listens on loopback and the box's tailnet address only, never the home LAN
# (ADR-0003). Loopback keeps the art worker and anything else on the box working; the Mac reaches it over the tailnet.
# It also drops two flags the service had (issue #49): --highvram forbids partly offloading a model, so the 20.5 GB
# Qwen-Image-Edit-2511 ran out of the 3090 Ti's 24 GB; --use-sage-attention made every Qwen image black (NaNs). A
# workflow that wants SageAttention patches its own model (KJNodes' "Patch Sage Attention KJ").
[Unit]
After=tailscaled.service
Wants=tailscaled.service

[Service]
# Binding the tailnet address fails until tailscaled has assigned it, so wait for it (up to a minute) first.
ExecStartPre=/usr/bin/timeout 60 /bin/sh -c 'until /usr/sbin/ip -4 addr show tailscale0 | grep -q "inet 100.80.25.1/"; do sleep 1; done'
ExecStart=
ExecStart=/home/matt/comfyui-easy-install/python_embeded/bin/python3 -W ignore::FutureWarning /home/matt/comfyui-easy-install/ComfyUI/main.py --listen 127.0.0.1,100.80.25.1 --port 8188
